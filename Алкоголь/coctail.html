<body>
<header>
  <h1>Коктейльная база</h1>
  <div class="sub">Выбери стиль, вбей что есть дома/в баре — и получишь коктейли, которые можно сделать полностью, почти сделать или быстро докупить. База стартовая: классика + популярные вариации.</div>
</header>

    <div class="types" id="types"></div>
    <div style="height:14px"></div>
    <div class="section-title">2. Что есть из ингредиентов</div>
    <div class="inputWrap">
      <input id="ingredientInput" placeholder="Например: джин, лимон, вермут..." autocomplete="off" />
      <div class="suggest" id="suggest"></div>
    </div>
    <div class="chips" id="chips"></div>
    <button class="clearBtn" id="clear">Очистить ингредиенты</button>
    <div style="height:14px"></div>
    <div class="section-title">3. Насколько строго искать</div>
    <div class="filters">
      <button data-miss="0">Только готовые</button>
      <button data-miss="1" class="active">Не хватает ≤1</button>
      <button data-miss="2">Не хватает ≤2</button>
      <button data-miss="99">Показать всё</button>
    </div>
  </aside>
  <section>
    <div class="stats" id="stats"></div>
    <div id="buyAdvice"></div>
    <div class="grid" id="results"></div>
  </section>
</main>
<dialog id="modal"><div class="modal" id="modalBody"></div></dialog>

function numericMl(v){return typeof v==='number' ? v : 0;}
function fmtAmount(v){return typeof v==='number' ? (Number.isInteger(v)?v:v.toString().replace('.',',')) + ' мл' : v;}
function getSpec(d){
  const spec = RECIPE_DETAILS[d.name] || {ice:'по рецепту', garnish:'по желанию', items:d.ingredients.map(i=>[i,'по вкусу',0])};
  const total = spec.items.reduce((sum,it)=>sum+numericMl(it[1]),0);
  const alcoholMl = spec.items.reduce((sum,it)=>sum+numericMl(it[1])*(Number(it[2])||0)/100,0);
  const abv = total ? Math.round(alcoholMl/total*100) : null;
  return {...spec,total,abv};
}

let selectedType='all', maxMiss=1, selected=[];
const normalize=s=>(ING_ALIASES[s.trim().toLowerCase()]||s.trim().toLowerCase());
const allIngredients=[...new Set(DRINKS.flatMap(d=>[...d.ingredients,...(d.optional||[])]))].sort((a,b)=>a.localeCompare(b,'ru'));
function renderTypes(){types.innerHTML=TYPES.map(t=>`<div class="type ${t[0]===selectedType?'active':''}" data-type="${t[0]}"><b>${t[1]}</b><span>${t[2]}</span></div>`).join('');document.querySelectorAll('.type').forEach(el=>el.onclick=()=>{selectedType=el.dataset.type;renderTypes();render();});}
function renderChips(){chips.innerHTML=selected.map(x=>`<span class="chip">${x}<button data-x="${x}">×</button></span>`).join('');chips.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=selected.filter(x=>x!==b.dataset.x);renderChips();render();});}
function scoreDrink(d){let req=d.ingredients.filter(x=>!(d.optional||[]).includes(x));let have=new Set(selected.map(normalize));let matched=d.ingredients.filter(i=>have.has(normalize(i)));let missing=req.filter(i=>!have.has(normalize(i)));let optionalMissing=(d.optional||[]).filter(i=>!have.has(normalize(i)));let pct=d.ingredients.length?Math.round(matched.length/d.ingredients.length*100):0;return{matched,missing,optionalMissing,pct};}
function buyRecommendations(){
 let have=new Set(selected.map(normalize));
 if(!selected.length) return [];
 let candidates=[...new Set(DRINKS.flatMap(d=>d.ingredients).filter(i=>!have.has(normalize(i))))];
 return candidates.map(ing=>{
   let withIt=[...have, normalize(ing)];
   let count=DRINKS.filter(d=>selectedType==='all'||d.type===selectedType).map(d=>{
     let req=d.ingredients.filter(x=>!(d.optional||[]).includes(x));
     return req.filter(x=>!withIt.includes(normalize(x))).length;
   }).filter(m=>m===0).length;
   let now=DRINKS.filter(d=>selectedType==='all'||d.type===selectedType).map(d=>scoreDrink(d)).filter(s=>s.missing.length===0).length;
   let opens=count-now;
   let examples=DRINKS.filter(d=>selectedType==='all'||d.type===selectedType).filter(d=>d.ingredients.map(normalize).includes(normalize(ing))).slice(0,3).map(d=>d.name).join(', ');
   return {ing,opens,examples};
 }).filter(x=>x.opens>0).sort((a,b)=>b.opens-a.opens||a.ing.localeCompare(b.ing,'ru')).slice(0,6);
}
function render(){let list=DRINKS.map((d,idx)=>({...d,idx,s:scoreDrink(d)})).filter(d=>selectedType==='all'||d.type===selectedType).filter(d=>d.s.missing.length<=maxMiss).sort((a,b)=>a.s.missing.length-b.s.missing.length||b.s.pct-a.s.pct||a.name.localeCompare(b.name));
 let full=list.filter(d=>d.s.missing.length===0).length;
 stats.innerHTML=`<div class="stat">Найдено: <b>${list.length}</b></div><div class="stat">Ингредиентов выбрано: <b>${selected.length}</b></div><div class="stat">Полных совпадений: <b>${full}</b></div>`;
 let buys=buyRecommendations();
 buyAdvice.innerHTML=buys.length?`<div class="card buyBox"><div class="section-title">Что докупить, чтобы открыть больше коктейлей</div><div class="buyList">${buys.map(b=>`<div class="buyItem"><b>${b.ing}</b> <span class="ok">+${b.opens}</span><small>${b.examples}</small></div>`).join('')}</div></div>`:'';
 results.innerHTML=list.length?list.map((d,i)=>`<article class="drink" data-i="${d.idx}"><h3>${d.name}</h3><div class="match">Совпадение ${d.s.pct}% · ${TYPES.find(t=>t[0]===d.type)?.[1]||d.type} · ${d.method} · ${getSpec(d).total||'—'} мл · ≈${getSpec(d).abv??'—'}%</div><div class="bar"><i style="width:${d.s.pct}%"></i></div><div class="meta"><span class="tag">${d.base}</span><span class="tag">${d.glass}</span></div><div class="need">${d.s.missing.length?'<span class="bad">Не хватает: '+d.s.missing.join(', ')+'</span>':'<span class="ok">Можно сделать полностью</span>'}${d.s.optionalMissing.length?'<br><span class="bad">Опционально: '+d.s.optionalMissing.join(', ')+'</span>':''}</div></article>`).join(''):`<div class="card empty">Ничего не найдено. Ослабь фильтр или добавь больше ингредиентов.</div>`;
 document.querySelectorAll('.drink').forEach(el=>el.onclick=()=>openDrink(DRINKS[+el.dataset.i]));}
function openDrink(d){
 let s=scoreDrink(d); let spec=getSpec(d);
 const have = new Set(selected.map(normalize));
 const rows = spec.items.map(it=>{
   const ing=it[0], amount=it[1];
   const isOpt=(d.optional||[]).includes(ing);
   const ok=have.has(normalize(ing));
   const cls=ok?'ok':(isOpt?'bad':'bad');
   const mark=ok?'✓':'×';
   return `<tr class="${cls}"><td>${mark} ${ing}${isOpt?' <small>(опц.)</small>':''}</td><td>${fmtAmount(amount)}</td></tr>`;
 }).join('');
 modalBody.innerHTML=`<div class="modalHead"><div><h2 style="margin:0 0 4px">${d.name}</h2><div class="note">${TYPES.find(t=>t[0]===d.type)?.[1]} · ${d.method} · бокал: ${d.glass}</div></div><button class="x" onclick="modal.close()">Закрыть</button></div><p>${d.note}</p><div class="miniFacts"><div class="miniFact"><small>Общий объём</small><b>${spec.total||'—'} мл</b></div><div class="miniFact"><small>Крепость до разбавления льдом</small><b>≈${spec.abv??'—'}%</b></div><div class="miniFact"><small>Лёд</small><b>${spec.ice}</b></div><div class="miniFact"><small>Украшение</small><b>${spec.garnish}</b></div></div><p class="warn">Крепость примерная: фактическая будет ниже после таяния льда. Для биттеров и ликёров ABV взят типовой.</p><div class="cols"><div><h3>Рецепт</h3><table class="recipeTable">${rows}</table><h3>Приготовление</h3><ol class="recipe">${d.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div><div><h3>Профиль вкуса</h3>${Object.entries(d.taste).map(([k,v])=>`<div class="taste"><label><span>${k}</span><span>${v}/5</span></label><div class="bar"><i style="width:${v*20}%"></i></div></div>`).join('')}<p class="note">Совет: сначала пробуй базовые формулы — Daiquiri, Whiskey Sour, Old Fashioned, Negroni, Martini. Они быстро учат понимать баланс.</p></div></div>`; modal.showModal();}
ingredientInput.addEventListener('input',()=>{let q=ingredientInput.value.trim().toLowerCase(); if(!q){suggest.style.display='none';return} let found=allIngredients.filter(i=>i.includes(q)||normalize(i).includes(q)).slice(0,12); suggest.innerHTML=found.map(i=>`<div data-v="${i}">${i}<br><small>${DRINKS.filter(d=>d.ingredients.includes(i)).slice(0,3).map(d=>d.name).join(', ')}</small></div>`).join(''); suggest.style.display=found.length?'block':'none'; suggest.querySelectorAll('div').forEach(el=>el.onclick=()=>addIngredient(el.dataset.v));});
ingredientInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&ingredientInput.value.trim()){addIngredient(normalize(ingredientInput.value));}});
function addIngredient(v){v=normalize(v); if(!selected.includes(v)) selected.push(v); ingredientInput.value=''; suggest.style.display='none'; renderChips(); render();}
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); maxMiss=+b.dataset.miss; render();});
clear.onclick=()=>{selected=[];renderChips();render();};
document.addEventListener('click',e=>{if(!e.target.closest('.inputWrap'))suggest.style.display='none'});
renderTypes();renderChips();render();
</script>
